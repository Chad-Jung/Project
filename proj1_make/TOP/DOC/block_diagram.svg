00 bps (parameter BAUD_RATE)</text><rect x="90" y="892" width="180" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="98" y="910" class="td">System clock</text><rect x="270" y="892" width="520" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="278" y="910" class="td">50 MHz target (parameter CLK_FREQ), synthesis 16 ns</text><rect x="90" y="918" width="180" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="98" y="936" class="td">Oversampling</text><rect x="270" y="918" width="520" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="278" y="936" class="td">16x (OSR), RX mid-bit sampling</text><rect x="90" y="944" width="180" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="98" y="962" class="td">FIFO</text><rect x="270" y="944" width="520" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="278" y="962" class="td">8-depth x 8-bit synchronous, TX 1 / RX 1</text><rect x="90" y="970" width="180" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="98" y="988" class="td">Interrupt</text><rect x="270" y="970" width="520" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="278" y="988" class="td">TX empty | RX full | frame error | overrun (masked by INT_EN)</text><rect x="90" y="996" width="180" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="98" y="1014" class="td">Reset</text><rect x="270" y="996" width="520" height="26" fill="#ffffff" stroke="#555" stroke-width="1"/><text x="278" y="1014" class="td">clr_n asynchronous, active low</text><text x="860" y="800" class="ttitle">Register map (_UART_REG_IF)</text><rect x="860" y="814" width="60" height="26" fill="#e8e8e8" stroke="#555" stroke-width="1"/><text x="868" y="832" class="th">Addr</text><rect x="920" y="814" width="100" height="26" fill="#e8e8e8" stroke="#555" stroke-width="1"/><text x="928" y="832" class="th">Name</text><rect x="1020" y="814" width="55" height="26"